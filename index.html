<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Training Program</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Главный экран -->
        <div id="homeScreen" class="screen active">
            <div class="header">
                <h1>DevOps Training Program</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="btnImport">📂 Импорт</button>
                    <button class="btn btn-secondary" id="btnStats">📊 Статистика</button>
                </div>
            </div>
            
            <div id="topicCards" class="topic-cards"></div>
            
            <input type="file" id="fileInput" accept=".json" style="display:none">
        </div>

        <!-- Экран выбора подтем -->
        <div id="subtopicsScreen" class="screen">
            <div class="subtopics-header">
                <button class="btn btn-icon" id="btnBackToHome">← Назад</button>
                <h2 id="currentTopicTitle">Название темы</h2>
            </div>
            
            <div class="topic-selector">
                <div id="subtopicGrid" class="topic-grid"></div>
                
                <div class="selector-controls">
                    <div class="shuffle-control">
                        <input type="checkbox" id="shuffleCheck">
                        <label for="shuffleCheck">🔀 Перемешать вопросы</label>
                    </div>
                    <button class="btn btn-secondary" id="btnTimerSettings">⏱️ Таймер</button>
                    <button class="btn btn-primary" id="btnStartQuiz" disabled>Приступить →</button>
                </div>
                <div class="total-info" title="Нажмите чтобы увидеть все вопросы">
                    Всего вопросов: <span id="totalQcount">0</span>
                    <span class="hint">(нажмите для списка)</span>
                </div>
            </div>
        </div>

        <!-- Экран настроек таймера -->
        <div id="timerSettingsScreen" class="screen">
            <div class="subtopics-header">
                <button class="btn btn-icon" id="btnBackToSubtopicsFromTimer">← Назад</button>
                <h2>⏱️ Настройки таймера</h2>
            </div>
            
            <div class="timer-settings">
                <div class="timer-option">
                    <input type="checkbox" id="timerEnable">
                    <label for="timerEnable">⏱️ Включить таймер прямого отсчета</label>
                </div>
                <div class="timer-option">
                    <input type="checkbox" id="countdownEnable">
                    <label for="countdownEnable">⏳ Включить обратный отсчет</label>
                </div>
                <div class="timer-input-group" id="countdownInputGroup" style="display:none;">
                    <label for="countdownMinutes">Количество минут:</label>
                    <input type="number" id="countdownMinutes" min="1" max="999" value="30">
                    <div class="timer-quick-buttons">
                        <button class="btn btn-secondary btn-small" data-minutes="30">+30</button>
                        <button class="btn btn-secondary btn-small" data-minutes="45">+45</button>
                        <button class="btn btn-secondary btn-small" data-minutes="60">+60</button>
                    </div>
                </div>
                <button class="btn btn-primary" id="btnSaveTimerSettings">Сохранить настройки</button>
            </div>
        </div>

        <!-- Экран теста -->
        <div id="testScreen" class="screen">
            <div class="test-header">
                <button class="btn btn-icon" id="btnBackToSubtopics">← Назад</button>
                <div id="timerDisplay" class="timer-circle" style="display:none;">
                    <span id="timerText">00:00</span>
                </div>
                <span id="progressBadge">1 / 10</span>
            </div>
            
            <div id="flashContainer" class="flash-container"></div>
            
            <div class="question-hint-container">
                <div id="questionHint"></div>
            </div>
            
            <div class="card-wrapper">
                <div class="anki-card" id="cardQuestion">
                    <div class="card-inner">
                        <div class="card-front" id="cardFront">
                            <div class="card-content">Вопрос</div>
                        </div>
                        <div class="card-back" id="cardBack">
                            <div class="card-content">Ответ</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card-actions">
                <button class="btn btn-success" id="btnKnow">✅ Знаю</button>
                <button class="btn btn-secondary" id="btnRepeat">🔄 Повторить</button>
                <button class="btn btn-secondary" id="btnNext">➡️ Дальше</button>
            </div>
            
            <div id="timeoutContainer" style="display:none; margin-top: 20px;">
                <button class="btn btn-danger" id="btnFinishAttempt">⏰ Завершить попытку</button>
            </div>
        </div>

        <!-- Экран результатов -->
        <div id="resultScreen" class="screen">
            <div class="result-card">
                <h2>🏁 Результат</h2>
                <div class="score-display">
                    <div class="score-number" id="scoreCorrect">0</div>
                    <div class="score-label">правильных</div>
                </div>
                <div class="score-display repeat">
                    <div class="score-number" id="scoreRepeat">0</div>
                    <div class="score-label">частичных</div>
                </div>
                <div class="score-display wrong">
                    <div class="score-number" id="scoreWrong">0</div>
                    <div class="score-label">неправильных</div>
                </div>
                <div id="timerResult"></div>
                <div class="result-actions">
                    <button class="btn btn-primary" id="btnRetry">🔄 Начать заново</button>
                    <button class="btn btn-secondary" id="btnResultToHome">🏠 Домой</button>
                </div>
            </div>
        </div>

        <!-- Экран статистики -->
        <div id="statsScreen" class="screen">
            <div class="stats-header">
                <h2>📈 История попыток</h2>
                <button class="btn btn-secondary" id="btnBackHomeFromStats">← Назад</button>
            </div>
            <div id="statsList" class="stats-grid"></div>
        </div>

        <!-- Модальное окно деталей статистики -->
        <div id="statsDetailModal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Детали попытки</h2>
                    <button class="btn btn-icon" id="btnCloseModal">✕</button>
                </div>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="linux_anki.js"></script>
    <script src="app.js"></script>
</body>
</html>
